services:

  # Trigger the recording of a rosbag
  ros2-bag-record-trigger:
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/analysis/event_detector_bag_recording:latest_prepare-for-github_ci
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    depends_on:
      event-detector-bag-recording:
        condition: service_started
    command: |
            ros2 topic pub -1 /event_detector/start_recording event_detector_bag_recording_msgs/msg/StartRecording
            "{recording_id: 'triggered',
            start_time: {sec: 1732184662, nanosec: 0},
            end_time: {sec: 1732184667, nanosec: 0},
            topics: ['/tf', '/tf_static', '/vehicles/Ego/drivers/front_lidar/pointcloud', '/vehicles/Ego/drivers/front_camera/image', '/vehicles/Ego/drivers/front_camera/camera_info', '/vehicles/Ego/bounding_box', '/vehicles/Ego/pose', '/vehicles/Ego/twist', '/vehicles/Ego/acceleration', '/objects/object_01/bounding_box', '/objects/object_02/bounding_box', '/objects/object_03/bounding_box', '/objects/object_04/bounding_box', '/objects/object_05/bounding_box', '/objects/object_06/bounding_box', '/objects/object_07/bounding_box', '/objects/object_08/bounding_box', '/objects/object_09/bounding_box', '/objects/object_10/bounding_box', '/objects/object_11/bounding_box', '/objects/object_12/bounding_box', '/objects/object_13/bounding_box', '/objects/object_14/bounding_box', '/objects/object_15/bounding_box', '/objects/object_16/bounding_box', '/objects/object_17/bounding_box', '/objects/object_18/bounding_box', '/objects/object_19/bounding_box', '/objects/object_20/bounding_box', '/objects/object_21/bounding_box', '/objects/object_22/bounding_box', '/objects/object_23/bounding_box', '/objects/object_24/bounding_box', '/objects/object_25/bounding_box', '/objects/object_26/bounding_box', '/objects/object_27/bounding_box', '/objects/object_28/bounding_box', '/objects/object_29/bounding_box', '/objects/object_30/bounding_box'],
            rule: 'bag_recording',
            scenario_participants: ['Ego', 'Objects']}"

  # Start the event detector with bag recording plugin
  event-detector-bag-recording:
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/analysis/event_detector_bag_recording:latest_prepare-for-github_ci
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    depends_on:
      ros2-monitoring-original:
        condition: service_started
    volumes:
      - ./event_detector_bag_recording_plugin.params.yml:/docker-ros/ws/install/event_detector_bag_recording_plugin/share/event_detector_bag_recording_plugin/config/params.yml
      - ./rosbags-saved:/rosbags-saved
    command: ros2 launch event_detector_bag_recording_plugin event_detector_bag_recording_plugin.launch.py

  # Visualize the original rosbag
  ros2-monitoring-original:
    image: ghcr.io/openads-project/monitoring:latest
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - DISPLAY
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./ros2.original.rviz:/ros2.original.rviz
    command: rviz2 -d /ros2.original.rviz --ros-args --remap _log_disable_rosout:=true -p use_sim_time:=true

  # Play the original rosbag from which we want to record a subset
  ros2-bag-play-original:
    image: rwthika/event_detector_examples:2026-09
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    depends_on:
      event-detector-bag-recording:
        condition: service_started
    command: ros2 bag play -l -r 0.5 /home/dockeruser/ws/bagfiles/event_detector_bag_recording/example-rosbag --clock

  # Wait for a rosbag to be recorded, then start playing it
  ros2-bag-play-saved:
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/analysis/event_detector_bag_recording:latest
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    depends_on:
      ros2-monitoring-saved:
        condition: service_started
    networks:
      - saved-rosbag
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./rosbags-saved:/rosbags-saved
    command: sh -c "while [ ! -f /rosbags-saved/triggered-bag_recording-2/metadata.yaml ]; do sleep 1; done && ros2 bag play -l -r 0.5 /rosbags-saved/triggered-bag_recording-2"

  # Visualize the playback of the recorded rosbag
  ros2-monitoring-saved:
    image: ghcr.io/openads-project/monitoring:latest
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - DISPLAY
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - saved-rosbag
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./ros2.recorded.rviz:/ros2.recorded.rviz
    command: rviz2 -d /ros2.recorded.rviz --ros-args --remap _log_disable_rosout:=true -p use_sim_time:=true

# Make sure that ros2-bag-play-saved and ros2-monitoring-saved can only communicate with each other
networks:
  saved-rosbag:
    driver: bridge
